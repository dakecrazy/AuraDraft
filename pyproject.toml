[project]
name = "auradraft"
version = "2.0.0"
description = "AuraDraft — token-based knowledge base with MoE-inspired routing and a shared inspiration field (Aura)"
requires-python = ">=3.10"
dependencies = [
    "tiktoken>=0.7",
    "numpy>=1.24",
]

[project.optional-dependencies]
pdf = [
    "pymupdf>=1.24",
    "PyPDF2>=3.0",
]
full = [
    "transformers>=4.40",
    "sentencepiece>=0.2",
    "sentence-transformers>=2.5",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
